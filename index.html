<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - Ghorashal Municipality</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            margin-top: 80px; /* Space for the logo */
            border-top: 2px solid #28a745;
        }
        .logo-placeholder {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border-radius: 50%;
            border: 5px solid #dc3545; /* Red border like the image */
            position: absolute;
            top: -50px; /* Half way up the card */
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Optional: You can add an image inside if you have one, 
           or just keep it empty like the reference */
        /* .logo-placeholder img { width: 60%; height: auto; } */

        .approved-text {
            color: #28a745; /* Green color */
            font-size: 22px;
            font-weight: bold;
            margin-top: 40px; /* Below logo placeholder */
            text-transform: uppercase;
        }
        .municipality-text {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .divider {
            border: 0;
            border-top: 1px solid #ccc;
            margin: 20px 0;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        .details-container {
            text-align: left;
            margin-top: 30px;
            font-size: 16px;
            line-height: 1.8;
        }
        .details-container p {
            margin: 5px 0;
        }
        .details-container strong {
            color: #444;
        }
        .footer-text {
            color: #28a745;
            font-size: 14px;
            font-style: italic;
            margin-top: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Red Circle Logo Placeholder -->
        <div class="logo-placeholder">
            <!-- If you have the municipality logo image named 'logo.png', 
                 uncomment the line below and adjust width/height -->
            <!-- <img src="logo.png" alt="Municipality Logo"> -->
        </div>

        <div class="approved-text">
            THIS CERTIFICATE IS<br>
            APPROVED<br>
            BY
        </div>
        <div class="municipality-text">
            GHORASHAL MUNICIPALITY
        </div>

        <hr class="divider">
        <div style="color: #888; font-size: 12px; margin-bottom: 10px;">---- Certificate Details ----</div>

        <div class="details-container">
            <p><strong>Name:</strong> মোঃ শাহরিয়ার ভূইয়া</p>
            <p><strong>Father/Husband Name:</strong> মোঃ পনির ভূইয়া</p>
            <p><strong>District:</strong> Narsingdi</p>
            <p><strong>Country:</strong> Bangladesh</p>
        </div>

        <div class="footer-text">
            100% authentic certificate!
        </div>
    </div>

</body>
</html>
